
name: Build NASHEED Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.env.example'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Application & Sync Capacitor
        run: npm run build:android
        env:
          BASE_PATH: './'
          NODE_ENV: production
          VITE_SUPABASE_URL_NASHEED: ${{ secrets.VITE_SUPABASE_URL_NASHEED || vars.VITE_SUPABASE_URL_NASHEED || '' }}
          VITE_SUPABASE_ANON_KEY_NASHEED: ${{ secrets.VITE_SUPABASE_ANON_KEY_NASHEED || vars.VITE_SUPABASE_ANON_KEY_NASHEED || '' }}
          VITE_SUPABASE_BUCKET_NASHEED: ${{ secrets.VITE_SUPABASE_BUCKET_NASHEED || vars.VITE_SUPABASE_BUCKET_NASHEED || 'nasheed-audio' }}
          VITE_SUPABASE_TABLE_NASHEED: ${{ secrets.VITE_SUPABASE_TABLE_NASHEED || vars.VITE_SUPABASE_TABLE_NASHEED || 'songs' }}
          VITE_SUPABASE_URL_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_URL_JTEC_MUSIC || vars.VITE_SUPABASE_URL_JTEC_MUSIC || '' }}
          VITE_SUPABASE_ANON_KEY_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_ANON_KEY_JTEC_MUSIC || vars.VITE_SUPABASE_ANON_KEY_JTEC_MUSIC || '' }}
          VITE_SUPABASE_BUCKET_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_BUCKET_JTEC_MUSIC || vars.VITE_SUPABASE_BUCKET_JTEC_MUSIC || 'music' }}
          VITE_SUPABASE_TABLE_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_TABLE_JTEC_MUSIC || vars.VITE_SUPABASE_TABLE_JTEC_MUSIC || 'songs' }}
          VITE_SUPABASE_URL_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_URL_LOVE_CHILL || vars.VITE_SUPABASE_URL_LOVE_CHILL || '' }}
          VITE_SUPABASE_ANON_KEY_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_ANON_KEY_LOVE_CHILL || vars.VITE_SUPABASE_ANON_KEY_LOVE_CHILL || '' }}
          VITE_SUPABASE_BUCKET_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_BUCKET_LOVE_CHILL || vars.VITE_SUPABASE_BUCKET_LOVE_CHILL || 'love-chill-audio' }}
          VITE_SUPABASE_TABLE_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_TABLE_LOVE_CHILL || vars.VITE_SUPABASE_TABLE_LOVE_CHILL || 'songs' }}

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Persistent Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > android/app/debug.keystore
            echo "Using configured debug keystore."
          elif [ -f android/app/debug.keystore ]; then
            echo "Using debug keystore already in the repository."
          else
            echo "No persistent keystore found; generating a temporary debug keystore."
            keytool -genkeypair \
              -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s android/app/debug.keystore
          keytool -list \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Accept Android SDK Licenses
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi

          mkdir -p "$ANDROID_ROOT/licenses"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

      - name: Install Required Android SDK Packages
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Package ID, Signature and APK
        run: |
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$DEBUG_APK" ]; then
            echo "Error: Debug APK was not generated."
            exit 1
          fi

          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$ANDROID_ROOT/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_ROOT/build-tools" \
            -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          else
            keytool -printcert -jarfile "$DEBUG_APK"
          fi

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$DEBUG_APK" | grep -E "package:|application-label:"
          fi

          mkdir -p apks_output
          cp "$DEBUG_APK" apks_output/nasheed-dashboard-debug.apk

          echo "Debug APK verified."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasheed-dashboard-apk
          path: apks_output/nasheed-dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30
          
