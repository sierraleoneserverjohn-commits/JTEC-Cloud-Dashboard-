name: Build NASHEED Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.env.example'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Application & Sync Capacitor
        run: npm run build:android
        env:
          BASE_PATH: './'
          NODE_ENV: production
          VITE_SUPABASE_URL_NASHEED: ${{ secrets.VITE_SUPABASE_URL_NASHEED || vars.VITE_SUPABASE_URL_NASHEED || '' }}
          VITE_SUPABASE_ANON_KEY_NASHEED: ${{ secrets.VITE_SUPABASE_ANON_KEY_NASHEED || vars.VITE_SUPABASE_ANON_KEY_NASHEED || '' }}
          VITE_SUPABASE_BUCKET_NASHEED: ${{ secrets.VITE_SUPABASE_BUCKET_NASHEED || vars.VITE_SUPABASE_BUCKET_NASHEED || 'nasheed-audio' }}
          VITE_SUPABASE_TABLE_NASHEED: ${{ secrets.VITE_SUPABASE_TABLE_NASHEED || vars.VITE_SUPABASE_TABLE_NASHEED || 'songs' }}
          VITE_SUPABASE_URL_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_URL_JTEC_MUSIC || vars.VITE_SUPABASE_URL_JTEC_MUSIC || '' }}
          VITE_SUPABASE_ANON_KEY_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_ANON_KEY_JTEC_MUSIC || vars.VITE_SUPABASE_ANON_KEY_JTEC_MUSIC || '' }}
          VITE_SUPABASE_BUCKET_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_BUCKET_JTEC_MUSIC || vars.VITE_SUPABASE_BUCKET_JTEC_MUSIC || 'music' }}
          VITE_SUPABASE_TABLE_JTEC_MUSIC: ${{ secrets.VITE_SUPABASE_TABLE_JTEC_MUSIC || vars.VITE_SUPABASE_TABLE_JTEC_MUSIC || 'songs' }}
          VITE_SUPABASE_URL_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_URL_LOVE_CHILL || vars.VITE_SUPABASE_URL_LOVE_CHILL || '' }}
          VITE_SUPABASE_ANON_KEY_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_ANON_KEY_LOVE_CHILL || vars.VITE_SUPABASE_ANON_KEY_LOVE_CHILL || '' }}
          VITE_SUPABASE_BUCKET_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_BUCKET_LOVE_CHILL || vars.VITE_SUPABASE_BUCKET_LOVE_CHILL || 'love-chill-audio' }}
          VITE_SUPABASE_TABLE_LOVE_CHILL: ${{ secrets.VITE_SUPABASE_TABLE_LOVE_CHILL || vars.VITE_SUPABASE_TABLE_LOVE_CHILL || 'songs' }}

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Apply Persistent Debug Keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Applying custom debug keystore from repository secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          fi
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Error: android/app/debug.keystore is missing!"
            exit 1
          fi
          echo "Verified persistent keystore presence:"
          ls -la android/app/debug.keystore
          echo "Keystore Certificate Details:"
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          mkdir -p "$ANDROID_ROOT/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-preview-license"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

      - name: Install Required Android SDK Packages
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug and Release APK with Gradle
        working-directory: android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify Package ID, Signing Certificate & APK Integrity
        run: |
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

          echo "=========================================="
          echo "VERIFYING NASHEED DASHBOARD DEBUG APK"
          echo "=========================================="

          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "${ANDROID_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "${ANDROID_ROOT}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "--- APKSIGNER CERTIFICATE FINGERPRINTS ---"
            "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          else
            echo "--- KEYTOOL CERTIFICATE FINGERPRINTS ---"
            keytool -printcert -jarfile "$DEBUG_APK"
          fi

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            echo "--- DUMPING PACKAGE AND VERSION METADATA ---"
            "$AAPT2" dump badging "$DEBUG_APK" | grep -E "package:|application-label:" || true
          fi

          # Prepare dedicated downloadable debug APK
          mkdir -p apks_output
          cp "$DEBUG_APK" apks_output/nasheed-dashboard-debug.apk
          cp "$DEBUG_APK" nasheed-dashboard-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasheed-dashboard-apk
          path: apks_output/nasheed-dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unsigned Release APK (Separate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasheed-dashboard-release-unsigned
          path: android/app/build/outputs/apk/release/
          if-no-files-found: ignore
          retention-days: 14
