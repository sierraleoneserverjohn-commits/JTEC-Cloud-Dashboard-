name: Build NASHEED Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.env.example'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application & Sync Capacitor
        run: npm run build:android
        env:
          BASE_PATH: './'
          NODE_ENV: production

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Ensure Build Tools
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Prepare Downloadable APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nasheed-dashboard-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasheed-dashboard-apk
          path: nasheed-dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30
