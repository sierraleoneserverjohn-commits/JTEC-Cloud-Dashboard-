name: Build NASHEED Dashboard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.env.example'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Application & Sync Capacitor
        run: npm run build:android
        env:
          BASE_PATH: './'
          NODE_ENV: production

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          mkdir -p "$ANDROID_ROOT/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-preview-license"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

      - name: Install Required Android SDK Packages
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Prepare Downloadable APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nasheed-dashboard-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasheed-dashboard-apk
          path: nasheed-dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30
